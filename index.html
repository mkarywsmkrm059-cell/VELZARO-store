<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VELZARO | متجر فيلزارو للعطور</title>
  <style>
    :root {
      --bg: #0f0f13;
      --card: #191922;
      --accent: #d4af37;
      --accent-hover: #e5c158;
      --text: #f5f5f7;
      --muted: #a1a1b5;
      --border: #2b2b38;
      --success: #1f9d68;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Tahoma", "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 15, 19, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .brand-sub {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .cart-btn {
      background: var(--accent);
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .cart-btn:hover {
      background: var(--accent-hover);
    }
